name: Amber final production verification temp

on:
  workflow_run:
    workflows:
      - Amber release inspect
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - .github/workflows/amber-final-production-verification-temp.yml

permissions:
  contents: write

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_APP: znanie-kgd80-fest

jobs:
  verify-release-send-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/amber-combine-jewelry-excursion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            registration/package-lock.json
            site/package-lock.json

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Correct TEST fixture and legacy cleanup compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          fixture = Path('registration/scripts/create-amber-test-application.ts')
          text = fixture.read_text(encoding='utf-8')
          text = text.replace(
              "const fullName = `TEST Проверка Почты ${timestamp.slice(-6)}`;",
              "const fullName = `ТЕСТ Проверка Почты ${timestamp.slice(-6)}`;",
          )
          fixture.write_text(text, encoding='utf-8')

          cleanup = Path('registration/src/services/special-test-cleanup.ts')
          text = cleanup.read_text(encoding='utf-8')
          text = text.replace(
              "  return normalized === 'ТЕСТ' || normalized.startsWith('ТЕСТ ');",
              "  return normalized === 'ТЕСТ'\n"
              "    || normalized.startsWith('ТЕСТ ')\n"
              "    || normalized === 'TEST'\n"
              "    || normalized.startsWith('TEST ');",
          )
          text = text.replace(
              "'Удаление разрешено только для заявок, где ФИО начинается с «ТЕСТ».'",
              "'Удаление разрешено только для заявок, где ФИО начинается с «ТЕСТ» или «TEST».'",
          )
          cleanup.write_text(text, encoding='utf-8')
          PY

      - name: Persist TEST fixture correction in feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name onedayonemasterpiece
          git config user.email estershow6@gmail.com
          git add \
            registration/scripts/create-amber-test-application.ts \
            registration/src/services/special-test-cleanup.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix: use valid TEST name and clean legacy fixture'
            git push origin HEAD:feat/amber-combine-jewelry-excursion
          fi

      - name: Validate backend and exact final winner template
        working-directory: registration
        run: |
          npm ci
          npm run check
          npm run test:special-amber-eligibility
          npm run test:special-test-cleanup
          npm run test:special-test-draw-exclusion
          npm run test:special-public-quota
          npm run test:special-draws

      - name: Install site tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          command -v aws

      - name: Build corrected public page
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Publish corrected page and compiled assets
        env:
          YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YC_ACCESS_KEY_ID"
          test -n "$YC_SECRET_ACCESS_KEY"
          export AWS_ACCESS_KEY_ID="$YC_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$YC_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=ru-central1
          endpoint='https://storage.yandexcloud.net'
          bucket='kgd80.ru'
          page='site/dist/special/amber-combine-jewelry-excursion/index.html'
          test -f "$page"

          mapfile -t compiled_assets < <(
            grep -oE '/_astro/[^"'"'"'<> ?]+' "$page" | sed 's/[#?].*$//' | sort -u
          )

          for asset in "${compiled_assets[@]}"; do
            source="site/dist${asset}"
            key="${asset#/}"
            test -f "$source" || continue
            content_type='application/octet-stream'
            case "$source" in
              *.css) content_type='text/css; charset=utf-8' ;;
              *.js|*.mjs) content_type='application/javascript; charset=utf-8' ;;
              *.svg) content_type='image/svg+xml' ;;
              *.woff2) content_type='font/woff2' ;;
              *.woff) content_type='font/woff' ;;
            esac
            aws --endpoint-url "$endpoint" s3api put-object \
              --bucket "$bucket" \
              --key "$key" \
              --body "$source" \
              --content-type "$content_type" \
              --cache-control 'public, max-age=31536000, immutable' >/dev/null
          done

          aws --endpoint-url "$endpoint" s3api put-object \
            --bucket "$bucket" \
            --key 'special/amber-combine-jewelry-excursion/index.html' \
            --body "$page" \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'no-store, no-cache, must-revalidate, max-age=0' >/dev/null

      - name: Verify corrected live form
        shell: bash
        run: |
          set -euo pipefail
          live_url="https://kgd80.ru/special/amber-combine-jewelry-excursion/?release=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in {1..20}; do
            curl -fsS -H 'Cache-Control: no-cache' "$live_url" >/tmp/live-amber-page.html
            if grep -q 'подать заявку могут только граждане Российской Федерации' /tmp/live-amber-page.html \
              && ! grep -q 'name="russianCitizenshipConfirmed"' /tmp/live-amber-page.html \
              && ! grep -q 'Подтверждаю, что являюсь гражданином Российской Федерации' /tmp/live-amber-page.html; then
              break
            fi
            sleep 3
          done
          grep -q 'подать заявку могут только граждане Российской Федерации' /tmp/live-amber-page.html
          ! grep -q 'name="russianCitizenshipConfirmed"' /tmp/live-amber-page.html
          ! grep -q 'Подтверждаю, что являюсь гражданином Российской Федерации' /tmp/live-amber-page.html

      - name: Deploy backend with auditable TEST cleanup
        run: flyctl deploy --remote-only --app "$FLY_APP" --config fly.toml

      - name: Verify production backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl -fsS "https://${FLY_APP}.fly.dev/api/v1/health" >/tmp/health.json; then
              break
            fi
            sleep 4
          done
          grep -q '"ok":true' /tmp/health.json
          curl -fsS "https://${FLY_APP}.fly.dev/api/v1/special/events/amber-combine-jewelry-excursion?token=amber-combine-jewelry-20260811" >/tmp/amber-event.json
          grep -q '"requiresRussianCitizenship":false' /tmp/amber-event.json
          curl -fsSI "https://${FLY_APP}.fly.dev/shared-assets/email/amber-combine-jewelry-production.png" | grep -q '200'

      - name: Remove failed legacy TEST registration
        shell: bash
        run: |
          set -euo pipefail
          legacy='TEST-AMBER-MAIL-20260806191812-FF704C'
          flyctl ssh console -a "$FLY_APP" -C "sh -lc 'cd /app/registration && AMBER_TEST_APPLICATION_CODE=$legacy npm run cleanup:amber-test-application'" | tee /tmp/legacy-cleanup.log
          grep -q '"cleaned":true' /tmp/legacy-cleanup.log
          grep -q '"removedApplication":1' /tmp/legacy-cleanup.log

      - name: Create TEST registration and send normal application email
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console -a "$FLY_APP" -C "sh -lc 'cd /app/registration && AMBER_TEST_EMAIL=info@kgd80.ru npm run create:amber-test-application'" | tee /tmp/application.log
          json="$(grep -E '^\{"applicationCode":' /tmp/application.log | tail -n 1)"
          test -n "$json"
          printf '%s' "$json" >/tmp/application.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/application.json', encoding='utf-8'))
          assert data['sent'] is True
          assert data['target'] == 'info@kgd80.ru'
          assert data['applicationCode'].startswith('TEST-AMBER-MAIL-')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"AMBER_TEST_APPLICATION_CODE={data['applicationCode']}\n")
              f.write(f"AMBER_TEST_APPLICATION_MESSAGE_ID={data['messageId']}\n")
              f.write(f"AMBER_TEST_APPLICATION_SUBJECT={data['subject']}\n")
          PY

      - name: Send exact final winner email and delete TEST registration
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console -a "$FLY_APP" -C "sh -lc 'cd /app/registration && AMBER_WINNER_PREVIEW_EMAIL=info@kgd80.ru AMBER_WINNER_APPLICATION_CODE=\"$AMBER_TEST_APPLICATION_CODE\" AMBER_WINNER_FULL_NAME=Максим npm run send:amber-winner-preview'" | tee /tmp/winner.log
          json="$(grep -E '^\{"sent":true' /tmp/winner.log | tail -n 1)"
          test -n "$json"
          printf '%s' "$json" >/tmp/winner.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/winner.json', encoding='utf-8'))
          assert data['sent'] is True
          assert data['target'] == 'info@kgd80.ru'
          assert data['applicationCode'] == os.environ['AMBER_TEST_APPLICATION_CODE']
          assert data['subject'].startswith('Вы победили в розыгрыше:')
          assert 'ПРОЕКТ' not in data['subject'].upper()
          assert data['cleanup']['removedApplication'] == 1
          assert data['cleanup']['removedProfile'] == 1
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"AMBER_FINAL_WINNER_MESSAGE_ID={data['messageId']}\n")
              f.write(f"AMBER_FINAL_WINNER_SUBJECT={data['subject']}\n")
          PY

      - name: Print auditable result
        run: |
          echo "TEST application code: $AMBER_TEST_APPLICATION_CODE"
          echo "Application email message ID: $AMBER_TEST_APPLICATION_MESSAGE_ID"
          echo "Application email subject: $AMBER_TEST_APPLICATION_SUBJECT"
          echo "Winner email message ID: $AMBER_FINAL_WINNER_MESSAGE_ID"
          echo "Winner email subject: $AMBER_FINAL_WINNER_SUBJECT"
          echo "Legacy TEST registration cleanup: completed"
          echo "Current TEST registration cleanup: completed"
          flyctl releases -a "$FLY_APP" --json | head -c 2000
