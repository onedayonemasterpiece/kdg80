name: Amber final production verification

"on":
  workflow_dispatch:
  push:
    branches:
      - feat/amber-combine-jewelry-excursion
    paths:
      - .github/workflows/amber-final-production-verification-temp.yml

# This workflow deploys production and sends real verification emails.
# Serialize accidental duplicate requests while the release verification is active.
# Retry after making generated TEST-fixture cleanup idempotent for unstored placeholders.
concurrency:
  group: amber-final-production-verification
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_APP: znanie-kgd80-fest
  YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
  YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}

jobs:
  verify-release-send-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/amber-combine-jewelry-excursion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            registration/package-lock.json
            site/package-lock.json

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install site tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          command -v aws

      - name: Run final production verification
        run: bash scripts/run_amber_final_production_verification.sh
