name: Finalize amber feature branch

"on":
  push:
    branches:
      - feat/amber-combine-jewelry-excursion
    paths:
      - .github/workflows/amber-finalize-branch.yml

permissions:
  contents: write

jobs:
  finalize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/amber-combine-jewelry-excursion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            registration/package-lock.json
            site/package-lock.json

      - name: Install site build tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Merge current main and resolve the verification workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name onedayonemasterpiece
          git config user.email estershow6@gmail.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 && ! -f .git/MERGE_HEAD ]]; then
            echo 'Main merge did not start.' >&2
            exit "$merge_status"
          fi

          cat > .github/workflows/amber-final-production-verification-temp.yml <<'YAML'
          name: Amber final production verification

          "on":
            workflow_dispatch:

          # Manual production check: creates a visible TEST application, sends two real
          # emails to info@kgd80.ru and removes all generated TEST records afterwards.
          concurrency:
            group: amber-final-production-verification
            cancel-in-progress: false

          permissions:
            contents: read

          env:
            ALLOW_AMBER_PRODUCTION_VERIFICATION: "1"
            FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
            FLY_APP: znanie-kgd80-fest
            YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
            YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}

          jobs:
            verify-release-send-clean:
              if: github.ref == 'refs/heads/main'
              runs-on: ubuntu-latest
              timeout-minutes: 55
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0

                - uses: actions/setup-node@v4
                  with:
                    node-version: 22.12.0
                    cache: npm
                    cache-dependency-path: |
                      registration/package-lock.json
                      site/package-lock.json

                - uses: superfly/flyctl-actions/setup-flyctl@master

                - name: Install site tooling
                  run: |
                    sudo apt-get update -qq
                    sudo apt-get install -y -qq imagemagick
                    command -v aws

                - name: Run final production verification
                  run: bash scripts/run_amber_final_production_verification.sh
          YAML
          sed -i 's/^          //' .github/workflows/amber-final-production-verification-temp.yml
          git add .github/workflows/amber-final-production-verification-temp.yml

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$unresolved" ]]; then
            echo "Unresolved merge paths:" >&2
            printf '%s\n' "$unresolved" >&2
            exit 1
          fi

      - name: Integrate Telegram TEST proof into source
        shell: bash
        run: |
          set -euo pipefail
          (
            cd registration
            python3 scripts/patch-amber-test-bot.py
          )
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('registration/package.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data.get('scripts', {}).pop('precheck', None)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Remove one-time implementation machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/amber-email-verification.trigger \
            .github/workflows/apply-amber-48h-citizenship-winner-email.yml \
            registration/scripts/patch-amber-test-bot.py \
            scripts/apply_amber_48h_citizenship_winner_email.py \
            scripts/ensure_amber_test_fixture.py \
            scripts/finalize_amber_48h_citizenship_winner_email.py \
            scripts/fix_amber_registration_and_email.py \
            scripts/patch_amber_test_bot_notification.py

      - name: Validate registration backend
        working-directory: registration
        run: |
          npm ci
          npm run check
          npm run test:special-amber-eligibility
          npm run test:special-test-cleanup
          npm run test:special-test-draw-exclusion
          npm run test:special-public-quota
          npm run test:special-draws
          npm run test:special-social
          npm run test:special-social-reminders

      - name: Validate site build
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Drop unrelated generated build churn
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- \
            site/public/generated/speaker-strip \
            site/src/data/portrait-bounds.json \
            site/src/data/registration-state-manifest.json

      - name: Commit finalized merge and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/amber-finalize-branch.yml
          git add -A
          git diff --check
          git status --short
          git commit -m 'feat: finalize amber combine excursion release'
          git push origin HEAD:feat/amber-combine-jewelry-excursion
