name: Finalize amber feature branch

"on":
  push:
    branches:
      - feat/amber-combine-jewelry-excursion
    paths:
      - .github/workflows/amber-finalize-branch.yml

permissions:
  contents: write

jobs:
  finalize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/amber-combine-jewelry-excursion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            registration/package-lock.json
            site/package-lock.json

      - name: Install site build tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name onedayonemasterpiece
          git config user.email estershow6@gmail.com
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$unresolved" ]]; then
            echo "Unresolved merge paths:" >&2
            printf '%s\n' "$unresolved" >&2
            exit 1
          fi

      - name: Integrate Telegram TEST proof into source
        shell: bash
        run: |
          set -euo pipefail
          (
            cd registration
            python3 scripts/patch-amber-test-bot.py
          )
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('registration/package.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data.get('scripts', {}).pop('precheck', None)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Remove one-time non-workflow implementation machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/amber-email-verification.trigger \
            registration/scripts/patch-amber-test-bot.py \
            scripts/apply_amber_48h_citizenship_winner_email.py \
            scripts/ensure_amber_test_fixture.py \
            scripts/finalize_amber_48h_citizenship_winner_email.py \
            scripts/fix_amber_registration_and_email.py \
            scripts/patch_amber_test_bot_notification.py

      - name: Validate registration backend
        working-directory: registration
        run: |
          npm ci
          npm run check
          npm run test:special-amber-eligibility
          npm run test:special-test-cleanup
          npm run test:special-test-draw-exclusion
          npm run test:special-public-quota
          npm run test:special-draws
          npm run test:special-social
          npm run test:special-social-reminders

      - name: Validate site build
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Drop unrelated generated build churn
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- \
            site/public/generated/speaker-strip \
            site/src/data/portrait-bounds.json \
            site/src/data/registration-state-manifest.json

      - name: Commit and push finalized merge
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --check
          git status --short
          git commit -m 'feat: finalize amber combine excursion release [skip ci]'
          git push origin HEAD:feat/amber-combine-jewelry-excursion
