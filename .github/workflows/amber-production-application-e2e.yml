name: Amber production application E2E

on:
  workflow_dispatch:
  push:
    branches:
      - feat/amber-combine-jewelry-excursion
    paths:
      - .github/workflows/amber-production-application-e2e.yml
      - site/scripts/run_amber_production_application_e2e.mjs

permissions:
  contents: read
  actions: read

concurrency:
  group: amber-production-application-e2e
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  SAFE_FIXTURE_RUN_ID: '31080644073'
  SAFE_FIXTURE_ARTIFACT: amber-vk-passport-sanitized
  NO_COLOR: '1'

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/amber-combine-jewelry-excursion
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Download approved PII-sanitized Passport fixture
        shell: bash
        run: |
          rm -rf .codex-artifacts/vk-passport-sanitized
          mkdir -p .codex-artifacts/vk-passport-sanitized
          gh run download "$SAFE_FIXTURE_RUN_ID" \
            -n "$SAFE_FIXTURE_ARTIFACT" \
            -D .codex-artifacts/vk-passport-sanitized
          test -s .codex-artifacts/vk-passport-sanitized/fixtures/passport-test-01.jpg

      - name: Verify production before E2E
        shell: bash
        run: |
          mkdir -p .codex-artifacts/amber-combine-production-application-e2e
          curl --fail --silent --show-error --max-time 30 \
            https://znanie-kgd80-fest.fly.dev/api/v1/health \
            > .codex-artifacts/amber-combine-production-application-e2e/health-before-e2e.json
          curl --fail --silent --show-error --max-time 30 \
            https://kgd80.ru/special/amber-combine-jewelry-excursion/ \
            > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('.codex-artifacts/amber-combine-production-application-e2e/health-before-e2e.json').read_text())
          assert payload.get('ok') is True
          PY

      - name: Install Playwright
        working-directory: site
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run accepted production application and reversible cleanup
        working-directory: site
        env:
          AMBER_E2E_FIXTURE: ../.codex-artifacts/vk-passport-sanitized/fixtures/passport-test-01.jpg
          AMBER_E2E_ARTIFACT_DIR: ../.codex-artifacts/amber-combine-production-application-e2e
        run: npm run test:amber-production-application

      - name: Verify production after cleanup
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://znanie-kgd80-fest.fly.dev/api/v1/health \
            > .codex-artifacts/amber-combine-production-application-e2e/health-after-cleanup.json
          curl --fail --silent --show-error --max-time 30 \
            https://kgd80.ru/special/amber-combine-jewelry-excursion/ \
            > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('.codex-artifacts/amber-combine-production-application-e2e/health-after-cleanup.json').read_text())
          assert payload.get('ok') is True
          PY

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amber-production-application-e2e
          path: .codex-artifacts/amber-combine-production-application-e2e
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
