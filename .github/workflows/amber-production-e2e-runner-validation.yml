name: Amber production application E2E runner validation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/amber-combine-jewelry-excursion
    paths:
      - .github/workflows/amber-production-e2e-runner-validation.yml
      - site/scripts/run_amber_production_application_e2e.mjs
      - site/package.json

permissions:
  contents: read

jobs:
  validate-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Parse production E2E runner
        working-directory: site
        run: node --check scripts/run_amber_production_application_e2e.mjs

      - name: Verify Playwright import
        working-directory: site
        run: node -e "import('playwright').then(() => console.log('playwright import ok'))"
