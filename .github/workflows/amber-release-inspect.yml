name: Amber release inspect

on:
  push:
    branches:
      - feat/amber-combine-jewelry-excursion
    paths:
      - .github/workflows/amber-release-inspect.yml

permissions:
  contents: read

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Capture current Fly state
        run: |
          mkdir -p artifact
          flyctl status -a znanie-kgd80-fest --json > artifact/status.json
          flyctl releases -a znanie-kgd80-fest --json > artifact/releases.json
      - uses: actions/upload-artifact@v4
        with:
          name: amber-current-fly-state
          path: artifact
          retention-days: 1
