name: Amber VK passport fixture discovery

on:
  workflow_dispatch:
  push:
    branches:
      - feat/amber-combine-jewelry-excursion
    paths:
      - .github/workflows/amber-vk-passport-discovery.yml
      - scripts/fetch_vk_passport_candidates.py

permissions:
  contents: read

env:
  VK_ACCESS_TOKEN7: ${{ secrets.VK_ACCESS_TOKEN7 }}
  VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
  VK_PASSPORT_OUTPUT: .codex-artifacts/vk-passport-candidates

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install local OCR and image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-rus fonts-dejavu-core
          python -m pip install --disable-pip-version-check --no-cache-dir pillow requests

      - name: Confirm secret availability without revealing values
        shell: bash
        run: |
          test -n "$VK_ACCESS_TOKEN7" || test -n "$VK_SERVICE_TOKEN"
          echo "VK credentials are available to the runner."

      - name: Discover likely festival Passport photos
        run: python scripts/fetch_vk_passport_candidates.py

      - name: Upload private candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amber-vk-passport-candidates
          path: .codex-artifacts/vk-passport-candidates
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
