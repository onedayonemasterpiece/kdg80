name: Apply reversible special E2E patch

on:
  workflow_dispatch:
  push:
    branches:
      - feat/amber-combine-jewelry-excursion
    paths:
      - .github/workflows/apply-special-e2e-cleanup-patch.yml
      - scripts/apply_special_e2e_cleanup_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/amber-combine-jewelry-excursion
          fetch-depth: 0

      - name: Apply focused source patch
        run: python3 scripts/apply_special_e2e_cleanup_patch.py

      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "codex-agent"
          git config user.email "codex-agent@example.local"
          git add registration/src/services/special-applications.ts registration/src/api/special.ts
          git commit -m "test: make special production E2E reversible"
          git push origin HEAD:feat/amber-combine-jewelry-excursion
