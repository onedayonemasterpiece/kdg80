name: Cancel Elena Ratkevich amber application

"on":
  push:
    branches: [main]
    paths: [.github/workflows/cancel-elena-ratkevich.yml]

permissions:
  contents: read

concurrency:
  group: cancel-elena-ratkevich-amber
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_APP: znanie-kgd80-fest

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Cancel and verify
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/cancel-elena-ratkevich.ts <<'TS'
          import { loadConfig } from '../src/config.js';
          import { createDatabase } from '../src/db/client.js';
          import { runMigrations } from '../src/db/migrate.js';
          import { decryptPii } from '../src/lib/crypto.js';
          import { normalizeFullName } from '../src/lib/normalize.js';

          const config = loadConfig();
          if (!config.piiPrivateKeyPemBase64) throw new Error('Private PII key is missing.');
          const db = createDatabase(config.sqlitePath);
          const eventSlug = 'amber-combine-jewelry-excursion';
          const reason = 'Отменено по обращению участника 7 августа 2026 года.';
          const target = new Set(['елена', 'раткевич']);

          try {
            runMigrations(db);
            const event = db.prepare('SELECT id FROM special_events WHERE slug = ? LIMIT 1')
              .get(eventSlug) as { id: number } | undefined;
            if (!event) throw new Error('Amber event not found.');

            const showing = db.prepare(`
              SELECT id, draw_status FROM special_event_showings
              WHERE special_event_id = ? ORDER BY starts_at ASC LIMIT 1
            `).get(event.id) as { id: number; draw_status: string } | undefined;
            if (!showing) throw new Error('Amber showing not found.');
            if (['published', 'final'].includes(showing.draw_status)) {
              throw new Error(`Draw already ${showing.draw_status}; cancellation needs draw correction.`);
            }

            const rows = db.prepare(`
              SELECT id, application_code, status, pii_ciphertext, pii_wrapped_key, pii_iv, pii_alg
              FROM special_applications WHERE special_event_id = ? ORDER BY id DESC
            `).all(event.id) as Array<any>;

            const matches = rows.filter((row) => {
              try {
                const pii = decryptPii(config.piiPrivateKeyPemBase64!, {
                  piiCiphertext: row.pii_ciphertext,
                  piiWrappedKey: row.pii_wrapped_key,
                  piiIv: row.pii_iv,
                  piiAlg: row.pii_alg,
                });
                const tokens = normalizeFullName(String(pii.fullName ?? ''))
                  .toLowerCase().replace(/ё/gu, 'е').split(/\s+/u);
                return [...target].every((token) => tokens.includes(token));
              } catch { return false; }
            });

            const accepted = matches.filter((row) => row.status === 'accepted');
            if (accepted.length !== 1) {
              const rejected = matches.filter((row) => row.status === 'rejected');
              if (accepted.length === 0 && rejected.length > 0) {
                console.log(JSON.stringify({ status: 'already_cancelled', applicationCode: rejected[0].application_code }));
                process.exit(0);
              }
              throw new Error(`Expected one accepted match, found ${accepted.length}.`);
            }

            const application = accepted[0];
            const changed = db.prepare(`
              UPDATE special_applications SET status = 'rejected', rejection_reason = ?
              WHERE id = ? AND status = 'accepted'
            `).run(reason, application.id).changes;
            if (changed !== 1) throw new Error(`Expected one update, got ${changed}.`);

            const verification = db.prepare(`
              SELECT a.status, a.rejection_reason,
                     COUNT(CASE WHEN a.status = 'accepted' AND a.score > 0 THEN 1 END) AS draw_candidate_count
              FROM special_applications a
              INNER JOIN special_application_showings aps ON aps.application_id = a.id
              WHERE a.id = ? AND aps.showing_id = ?
            `).get(application.id, showing.id) as any;
            if (verification.status !== 'rejected' || verification.rejection_reason !== reason || verification.draw_candidate_count !== 0) {
              throw new Error('Cancellation verification failed.');
            }

            console.log(JSON.stringify({
              status: 'cancelled',
              applicationCode: application.application_code,
              rejectionReason: verification.rejection_reason,
              drawCandidateCount: verification.draw_candidate_count,
              drawStatus: showing.draw_status,
            }));
          } finally {
            db.close();
          }
          TS

          payload="$(base64 -w0 /tmp/cancel-elena-ratkevich.ts)"
          flyctl ssh console -a "$FLY_APP" -C "sh -lc \"printf '%s' '$payload' | base64 -d > /app/registration/scripts/.cancel-elena-ratkevich.ts && cd /app/registration && npx tsx scripts/.cancel-elena-ratkevich.ts; code=\\$?; rm -f scripts/.cancel-elena-ratkevich.ts; exit \\$code\""
