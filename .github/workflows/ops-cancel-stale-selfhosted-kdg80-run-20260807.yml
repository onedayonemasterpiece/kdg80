name: Cancel stale self-hosted KDG80 incident run

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-cancel-stale-selfhosted-kdg80-run-20260807.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      STALE_RUN_ID: "31197111853"
    steps:
      - name: Cancel the obsolete queued self-hosted run
        shell: bash
        run: |
          set -euo pipefail
          status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}" --jq .status)"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}" --jq '.conclusion // ""')"
          echo "STALE_RUN_STATUS_BEFORE=$status"
          echo "STALE_RUN_CONCLUSION_BEFORE=$conclusion"

          if [[ "$status" != completed ]]; then
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}/cancel"
          fi

          for _ in $(seq 1 20); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}" --jq .status)"
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}" --jq '.conclusion // ""')"
            if [[ "$status" == completed ]]; then
              break
            fi
            sleep 2
          done

          echo "STALE_RUN_STATUS_AFTER=$status"
          echo "STALE_RUN_CONCLUSION_AFTER=$conclusion"
          test "$status" = completed
          test "$conclusion" = cancelled
          echo 'STALE_SELFHOSTED_KDG80_RUN_CANCELLED=true'
