name: Clean up one-off KDG80 incident workflows

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-cleanup-kdg80-incident-workflows-20260807.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Remove completed one-off operational workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git rm --ignore-unmatch \
            .github/workflows/ops-direct-selfhosted-contain-deploy-20260807.yml \
            .github/workflows/ops-emergency-contain-kdg80-via-token-secrets-20260807.yml \
            .github/workflows/ops-fly-contain-export-storm-20260807.yml \
            .github/workflows/ops-verify-kdg80-export-storm-recovery-20260807.yml \
            .github/workflows/ops-cancel-stale-selfhosted-kdg80-run-20260807.yml \
            .github/workflows/ops-cleanup-kdg80-incident-workflows-20260807.yml

          git commit -m 'chore: remove completed KDG80 incident workflows'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'KDG80_INCIDENT_WORKFLOW_CLEANUP=true'
