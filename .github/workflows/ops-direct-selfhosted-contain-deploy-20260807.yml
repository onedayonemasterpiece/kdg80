name: Direct self-hosted KDG80 incident containment and deploy

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-direct-selfhosted-contain-deploy-20260807.yml

permissions:
  contents: read

concurrency:
  group: direct-selfhosted-kdg80-incident-20260807
  cancel-in-progress: false

jobs:
  contain-deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Verify the expected incident host and Fly credential
        shell: bash
        run: |
          set -euo pipefail
          test -f /home/dev/.config/fly/release.env
          test -x /home/dev/.fly/bin/flyctl
          set -a
          . /home/dev/.config/fly/release.env
          set +a
          test -n "${FLY_API_TOKEN:-}"
          /home/dev/.fly/bin/flyctl status --app znanie-kgd80-fest >/dev/null
          echo 'DIRECT_FLY_ACCESS=true'

      - name: Stop Telegram retry delivery immediately
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . /home/dev/.config/fly/release.env
          set +a
          remote_command="node -e 'const t=process.env.TELEGRAM_BOT_TOKEN;if(!t)throw new Error(\"TELEGRAM_BOT_TOKEN missing\");const call=async(m,p)=>{const r=await fetch(\`https://api.telegram.org/bot\${t}/\${m}\`,{method:\"POST\",headers:{\"content-type\":\"application/x-www-form-urlencoded\"},body:new URLSearchParams(p||{})});const j=await r.json();if(!j.ok)throw new Error(m+\" failed\");return j.result};(async()=>{const b=await call(\"getWebhookInfo\");console.log(JSON.stringify({pending_before:b.pending_update_count||0,webhook_before:Boolean(b.url)}));await call(\"deleteWebhook\",{drop_pending_updates:\"true\"});const a=await call(\"getWebhookInfo\");console.log(JSON.stringify({pending_after:a.pending_update_count||0,webhook_after:Boolean(a.url)}));if(a.url||(a.pending_update_count||0)!==0)process.exit(2)})().catch(e=>{console.error(String(e&&e.message||e));process.exit(1)})'"
          /home/dev/.fly/bin/flyctl ssh console \
            --app znanie-kgd80-fest \
            --pty=false \
            --command "$remote_command"
          echo 'EXPORT_RETRY_DELIVERY_CONTAINED=true'

      - name: Fetch the exact tested production commit
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "$workdir" > "$RUNNER_TEMP/kdg80-workdir"
          git clone --filter=blob:none https://github.com/onedayonemasterpiece/kdg80.git "$workdir"
          git -C "$workdir" checkout --detach 75cc1292a94d1232940aa2095c74acee3c674c97
          test "$(git -C "$workdir" rev-parse HEAD)" = '75cc1292a94d1232940aa2095c74acee3c674c97'
          grep -Fq 'memory = "512mb"' "$workdir/fly.toml"

      - name: Deploy the exact tested hotfix
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . /home/dev/.config/fly/release.env
          set +a
          workdir="$(cat "$RUNNER_TEMP/kdg80-workdir")"
          cd "$workdir"
          /home/dev/.fly/bin/flyctl deploy \
            --app znanie-kgd80-fest \
            --config fly.toml \
            --remote-only \
            --yes

      - name: Verify registration, Telegram recovery and deployed migration
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . /home/dev/.config/fly/release.env
          set +a

          for i in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 10 \
              https://znanie-kgd80-fest.fly.dev/api/v1/health \
              | grep -q '"ok":true'; then
              break
            fi
            sleep 5
          done

          curl --fail --silent --show-error --max-time 15 \
            'https://znanie-kgd80-fest.fly.dev/api/v1/special/events/amber-combine-jewelry-excursion?token=amber-combine-jewelry-20260811' \
            | grep -q 'amber-combine-jewelry-excursion'

          remote_command="node -e 'const t=process.env.TELEGRAM_BOT_TOKEN;if(!t)throw new Error(\"TELEGRAM_BOT_TOKEN missing\");fetch(\`https://api.telegram.org/bot\${t}/getWebhookInfo\`).then(r=>r.json()).then(j=>{const x=j.result||{};console.log(JSON.stringify({pending:x.pending_update_count||0,webhook:Boolean(x.url),last_error:Boolean(x.last_error_message)}));if(!j.ok||!x.url||(x.pending_update_count||0)!==0)process.exit(2)}).catch(e=>{console.error(String(e&&e.message||e));process.exit(1)})'; cd /app/registration && node -e 'const Database=require(\"better-sqlite3\");const db=new Database(process.env.SQLITE_PATH||\"/data/registration.sqlite\",{readonly:true});const row=db.prepare(\"SELECT name FROM sqlite_master WHERE type=\\\"table\\\" AND name=\\\"telegram_update_claims\\\"\").get();console.log(JSON.stringify({telegram_update_claims:Boolean(row)}));if(!row)process.exit(3)'"
          /home/dev/.fly/bin/flyctl ssh console \
            --app znanie-kgd80-fest \
            --pty=false \
            --command "sh -lc '$remote_command'"

          /home/dev/.fly/bin/flyctl status --app znanie-kgd80-fest
          /home/dev/.fly/bin/flyctl scale show --app znanie-kgd80-fest
          echo 'KDG80_INCIDENT_HOTFIX_DEPLOYED=true'
