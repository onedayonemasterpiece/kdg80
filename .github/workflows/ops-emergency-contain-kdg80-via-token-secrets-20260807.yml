name: Emergency contain KDG80 via existing bot-token secret

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-emergency-contain-kdg80-via-token-secrets-20260807.yml

permissions:
  contents: read

concurrency:
  group: emergency-contain-kdg80-via-token-secrets-20260807
  cancel-in-progress: false

jobs:
  contain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN_01: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TOKEN_02: ${{ secrets.KGD80_TELEGRAM_BOT_TOKEN }}
      TOKEN_03: ${{ secrets.KDG80_TELEGRAM_BOT_TOKEN }}
      TOKEN_04: ${{ secrets.KGD80_BOT_TOKEN }}
      TOKEN_05: ${{ secrets.KDG80_BOT_TOKEN }}
      TOKEN_06: ${{ secrets.REGISTRATION_TELEGRAM_BOT_TOKEN }}
      TOKEN_07: ${{ secrets.REGISTRATION_BOT_TOKEN }}
      TOKEN_08: ${{ secrets.TELEGRAM_REGISTRATION_BOT_TOKEN }}
      TOKEN_09: ${{ secrets.TELEGRAM_BOT_TOKEN_KGD80 }}
      TOKEN_10: ${{ secrets.TELEGRAM_BOT_TOKEN_KDG80 }}
      TOKEN_11: ${{ secrets.TELEGRAM_TOKEN }}
      TOKEN_12: ${{ secrets.BOT_TOKEN }}
      TOKEN_13: ${{ secrets.TG_BOT_TOKEN }}
      TOKEN_14: ${{ secrets.KGD80_REG_BOT_TOKEN }}
      TOKEN_15: ${{ secrets.KDG80_REG_BOT_TOKEN }}
      TOKEN_16: ${{ secrets.KGD80REGBOT_TOKEN }}
      TOKEN_17: ${{ secrets.KGD80REG_BOT_TOKEN }}
      TOKEN_18: ${{ secrets.ZNANIE_TELEGRAM_BOT_TOKEN }}
      TOKEN_19: ${{ secrets.ZNANIE_BOT_TOKEN }}
      TOKEN_20: ${{ secrets.FESTIVAL_TELEGRAM_BOT_TOKEN }}
      TOKEN_21: ${{ secrets.FESTIVAL_BOT_TOKEN }}
      TOKEN_22: ${{ secrets.ADMIN_TELEGRAM_BOT_TOKEN }}
      TOKEN_23: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
      TOKEN_24: ${{ secrets.KGD80_ADMIN_BOT_TOKEN }}
    steps:
      - name: Match target bot and drop its webhook queue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          TARGET_ID = 8582027786
          names = [
              "TELEGRAM_BOT_TOKEN", "KGD80_TELEGRAM_BOT_TOKEN", "KDG80_TELEGRAM_BOT_TOKEN",
              "KGD80_BOT_TOKEN", "KDG80_BOT_TOKEN", "REGISTRATION_TELEGRAM_BOT_TOKEN",
              "REGISTRATION_BOT_TOKEN", "TELEGRAM_REGISTRATION_BOT_TOKEN",
              "TELEGRAM_BOT_TOKEN_KGD80", "TELEGRAM_BOT_TOKEN_KDG80", "TELEGRAM_TOKEN",
              "BOT_TOKEN", "TG_BOT_TOKEN", "KGD80_REG_BOT_TOKEN", "KDG80_REG_BOT_TOKEN",
              "KGD80REGBOT_TOKEN", "KGD80REG_BOT_TOKEN", "ZNANIE_TELEGRAM_BOT_TOKEN",
              "ZNANIE_BOT_TOKEN", "FESTIVAL_TELEGRAM_BOT_TOKEN", "FESTIVAL_BOT_TOKEN",
              "ADMIN_TELEGRAM_BOT_TOKEN", "TELEGRAM_ADMIN_BOT_TOKEN", "KGD80_ADMIN_BOT_TOKEN",
          ]

          def call(token, method, params=None):
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=urllib.parse.urlencode(params or {}).encode(),
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  payload = json.loads(response.read().decode())
              if payload.get("ok") is not True:
                  raise RuntimeError(method)
              return payload.get("result")

          present = 0
          chosen = None
          chosen_name = None
          for index, name in enumerate(names, start=1):
              token = os.environ.get(f"TOKEN_{index:02d}", "").strip()
              if not token:
                  continue
              present += 1
              try:
                  identity = call(token, "getMe") or {}
              except Exception:
                  continue
              if int(identity.get("id") or 0) == TARGET_ID:
                  chosen = token
                  chosen_name = name
                  break

          print(f"CANDIDATE_SECRETS_PRESENT={present}")
          if not chosen:
              raise RuntimeError("No repository secret matches @kgd80regbot")

          before = call(chosen, "getWebhookInfo") or {}
          print(f"MATCHED_SECRET_NAME={chosen_name}")
          print(f"PENDING_BEFORE={int(before.get('pending_update_count') or 0)}")
          print(f"WEBHOOK_WAS_PRESENT={bool(before.get('url'))}")
          call(chosen, "deleteWebhook", {"drop_pending_updates": "true"})
          after = call(chosen, "getWebhookInfo") or {}
          print(f"PENDING_AFTER={int(after.get('pending_update_count') or 0)}")
          print(f"WEBHOOK_PRESENT_AFTER={bool(after.get('url'))}")
          if after.get("url") or int(after.get("pending_update_count") or 0):
              raise RuntimeError("Containment verification failed")
          print("KDG80_EXPORT_STORM_CONTAINED=true")
          PY
