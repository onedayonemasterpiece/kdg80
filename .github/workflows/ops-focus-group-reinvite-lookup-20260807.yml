name: One-off focus-group production lookup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-focus-group-reinvite-lookup-20260807.yml

permissions:
  contents: read

concurrency:
  group: one-off-focus-group-production-lookup
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_APP: znanie-kgd80-fest

jobs:
  lookup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Query production read-only and emit encrypted result
        shell: bash
        env:
          LOOKUP_SCRIPT_GZ_B64: >-
            
          RECIPIENT_CERT_GZ_B64: >-
            
        run: |
          set -euo pipefail
          umask 077

          cleanup() {
            rm -f \
              /tmp/focus-group-production-result.json \
              /tmp/focus-group-production-result.cms \
              /tmp/focus-group-recipient-cert.pem \
              /tmp/focus-group-production-lookup.ts
            flyctl ssh console \
              -a "$FLY_APP" \
              -q \
              --pty=false \
              -C 'sh -lc "rm -f /tmp/focus-group-production-lookup.ts"' \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          printf '%s' "$LOOKUP_SCRIPT_GZ_B64" \
            | base64 -d \
            | gzip -d \
            > /tmp/focus-group-production-lookup.ts

          printf '%s' "$RECIPIENT_CERT_GZ_B64" \
            | base64 -d \
            | gzip -d \
            > /tmp/focus-group-recipient-cert.pem

          flyctl ssh sftp put \
            /tmp/focus-group-production-lookup.ts \
            /tmp/focus-group-production-lookup.ts \
            -a "$FLY_APP" \
            -q

          flyctl ssh console \
            -a "$FLY_APP" \
            -q \
            --pty=false \
            -C 'sh -lc "cd /app/registration && npx tsx /tmp/focus-group-production-lookup.ts"' \
            > /tmp/focus-group-production-result.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path('/tmp/focus-group-production-result.json').read_text(encoding='utf-8')
          )
          assert payload.get('queryMode') == 'read_only'
          assert payload.get('productionApp') == 'znanie-kgd80-fest'
          assert isinstance(payload.get('matches'), list)
          assert payload.get('targetCount') == 30
          print(
              'Read-only production lookup completed: '
              f"matched_rows={len(payload['matches'])}, "
              f"rows_scanned={payload.get('rowsScanned')}"
          )
          PY

          openssl cms -encrypt \
            -binary \
            -aes-256-cbc \
            -outform DER \
            -in /tmp/focus-group-production-result.json \
            -out /tmp/focus-group-production-result.cms \
            /tmp/focus-group-recipient-cert.pem

          rm -f /tmp/focus-group-production-result.json

          echo 'KDG80_FOCUS_GROUP_RESULT_BEGIN'
          base64 -w 76 /tmp/focus-group-production-result.cms
          echo 'KDG80_FOCUS_GROUP_RESULT_END'
