name: KDG80 Telegram export incident hotfix

"on":
  push:
    branches:
      - hotfix/telegram-export-retry-20260807
    paths:
      - .github/workflows/ops-hotfix-telegram-export-20260807.yml

permissions:
  contents: write

concurrency:
  group: kdg80-telegram-export-hotfix-20260807
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_APP: znanie-kgd80-fest
  HOTFIX_BRANCH: hotfix/telegram-export-retry-20260807

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the production-compatible hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/telegram-export-retry-20260807
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: registration/package-lock.json

      - name: Apply the narrow Telegram webhook and export patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('registration/src/services/telegram-bot.ts')
          text = path.read_text(encoding='utf-8')

          old_import = "import { Bot, type Context, InlineKeyboard, InputFile, Keyboard, webhookCallback } from 'grammy';"
          new_import = "import { Bot, type Context, InlineKeyboard, InputFile, Keyboard } from 'grammy';"
          if old_import not in text:
              raise SystemExit('grammY import anchor missing')
          text = text.replace(old_import, new_import, 1)

          storage_import = "import type { StoragePublisher } from '../lib/storage';\n"
          guard_import = """import {
            claimTelegramUpdate,
            getTelegramUpdateId,
            isStaleTelegramMessageUpdate,
            type TelegramUpdateEnvelope,
          } from './telegram-update-guard';
          """
          if guard_import not in text:
              if storage_import not in text:
                  raise SystemExit('storage import anchor missing')
              text = text.replace(storage_import, storage_import + guard_import, 1)

          events_constant = 'const EVENTS_PER_PAGE = 6;\n'
          age_constant = 'const TELEGRAM_UPDATE_MAX_AGE_SECONDS = 5 * 60;\n'
          if age_constant not in text:
              if events_constant not in text:
                  raise SystemExit('events constant anchor missing')
              text = text.replace(events_constant, events_constant + age_constant, 1)

          bot_state = "  const pendingFindPrompts = new Map<string, number>();\n"
          protected_state = """  const pendingFindPrompts = new Map<string, number>();
            let exportAllInFlight = false;
            let telegramUpdateTail: Promise<void> = Promise.resolve();
          """
          if 'let exportAllInFlight = false;' not in text:
              if bot_state not in text:
                  raise SystemExit('bot state anchor missing')
              text = text.replace(bot_state, protected_state, 1)

          command_start = "  bot.command('export_all', async (ctx) => {"
          command_end = "  bot.command('backup_sqlite', async (ctx) => {"
          command_begin = text.index(command_start)
          command_finish = text.index(command_end, command_begin)
          command_replacement = """  bot.command('export_all', async (ctx) => {
            const admin = requireAdminRole(String(ctx.from?.id ?? ''));
            if (!admin || admin.role !== 'superadmin') {
              await ctx.reply('Общий экспорт доступен только суперадмину.');
              return;
            }

            if (!deps.privateKeyPemBase64) {
              await ctx.reply('Нужен приватный ключ, чтобы подготовить общий экспорт.');
              return;
            }

            if (exportAllInFlight) {
              await ctx.reply('Сводный экспорт уже формируется. Дождитесь текущего файла.');
              return;
            }

            exportAllInFlight = true;
            const startedAt = Date.now();
            const rssBefore = process.memoryUsage().rss;
            try {
              const rows = listAllRegistrationsForExport(deps.db, deps.privateKeyPemBase64);
              const buffer = await buildRegistrationsXlsxBuffer(rows);
              await ctx.replyWithDocument(
                new InputFile(buffer, 'registrations-all.xlsx'),
                {
                  caption: 'Сводный XLSX по всем событиям.',
                },
              );
              app.log.info({
                updateId: ctx.update.update_id,
                rowCount: rows.length,
                xlsxBytes: buffer.byteLength,
                durationMs: Date.now() - startedAt,
                rssBeforeMb: Math.round(rssBefore / 1_048_576),
                rssAfterMb: Math.round(process.memoryUsage().rss / 1_048_576),
              }, 'telegram_export_all_completed');
            } catch (error) {
              app.log.error({
                err: error,
                updateId: ctx.update.update_id,
                durationMs: Date.now() - startedAt,
              }, 'telegram_export_all_failed');
              await ctx.reply('Не удалось подготовить сводный XLSX. Ошибка записана в лог сервера.');
            } finally {
              exportAllInFlight = false;
            }
          });

          """
          text = text[:command_begin] + command_replacement + text[command_finish:]

          callback_start = "  bot.callbackQuery(/^exp:(all|backup)$/u, async (ctx) => {"
          callback_end = "  bot.callbackQuery(/^spl$/u, async (ctx) => {"
          callback_begin = text.index(callback_start)
          callback_finish = text.index(callback_end, callback_begin)
          callback_replacement = """  bot.callbackQuery(/^exp:(all|backup)$/u, async (ctx) => {
            const admin = requireAdminRole(String(ctx.from?.id ?? ''));
            if (!admin || admin.role !== 'superadmin') {
              await ctx.answerCallbackQuery({
                text: 'Раздел экспорта доступен только суперадмину.',
                show_alert: true,
              });
              return;
            }

            const [, action] = ctx.match;

            if (action === 'all') {
              if (!deps.privateKeyPemBase64) {
                await ctx.answerCallbackQuery({
                  text: 'Нужен приватный ключ, чтобы подготовить общий экспорт.',
                  show_alert: true,
                });
                return;
              }

              if (exportAllInFlight) {
                await ctx.answerCallbackQuery({
                  text: 'Сводный экспорт уже формируется.',
                  show_alert: true,
                });
                return;
              }

              exportAllInFlight = true;
              const startedAt = Date.now();
              const rssBefore = process.memoryUsage().rss;
              await ctx.answerCallbackQuery({
                text: 'Готовлю сводный XLSX.',
              });

              try {
                const rows = listAllRegistrationsForExport(deps.db, deps.privateKeyPemBase64);
                const buffer = await buildRegistrationsXlsxBuffer(rows);
                await ctx.replyWithDocument(
                  new InputFile(buffer, 'registrations-all.xlsx'),
                  {
                    caption: 'Сводный XLSX по всем событиям.',
                    reply_markup: buildMainKeyboard(admin.role),
                  },
                );
                app.log.info({
                  updateId: ctx.update.update_id,
                  rowCount: rows.length,
                  xlsxBytes: buffer.byteLength,
                  durationMs: Date.now() - startedAt,
                  rssBeforeMb: Math.round(rssBefore / 1_048_576),
                  rssAfterMb: Math.round(process.memoryUsage().rss / 1_048_576),
                }, 'telegram_export_all_completed');
              } catch (error) {
                app.log.error({
                  err: error,
                  updateId: ctx.update.update_id,
                  durationMs: Date.now() - startedAt,
                }, 'telegram_export_all_failed');
                await ctx.reply('Не удалось подготовить сводный XLSX. Ошибка записана в лог сервера.');
              } finally {
                exportAllInFlight = false;
              }
              return;
            }

            await ctx.answerCallbackQuery({
              text: 'Готовлю резервную копию SQLite.',
            });

            const buffer = await createSqliteBackup(deps.db, 'registration-backup');
            await ctx.replyWithDocument(
              new InputFile(buffer, 'registration-backup.sqlite'),
              {
                caption: 'Резервная копия SQLite.',
                reply_markup: buildMainKeyboard(admin.role),
              },
            );
          });

          """
          text = text[:callback_begin] + callback_replacement + text[callback_finish:]

          webhook_start = "  if (!deps.skipWebhook) {"
          webhook_end = "  return {\n    bot,"
          webhook_begin = text.index(webhook_start)
          webhook_finish = text.index(webhook_end, webhook_begin)
          webhook_replacement = """  if (!deps.skipWebhook) {
            app.post(deps.webhookPath, async (request, reply) => {
              const secret = request.headers['x-telegram-bot-api-secret-token'];
              if (secret !== deps.webhookSecret) {
                reply.code(401);
                return {
                  error: 'telegram_secret_mismatch',
                };
              }

              const update = request.body as TelegramUpdateEnvelope;
              const updateId = getTelegramUpdateId(update);
              if (updateId === null) {
                reply.code(400);
                return {
                  error: 'telegram_update_id_missing',
                };
              }

              if (isStaleTelegramMessageUpdate(update, TELEGRAM_UPDATE_MAX_AGE_SECONDS)) {
                app.log.warn({ updateId }, 'telegram_stale_message_update_skipped');
                return {
                  ok: true,
                  skipped: 'stale',
                };
              }

              if (!claimTelegramUpdate(deps.db, updateId)) {
                app.log.info({ updateId }, 'telegram_duplicate_update_skipped');
                return {
                  ok: true,
                  skipped: 'duplicate',
                };
              }

              reply.code(200).send({ ok: true });
              setImmediate(() => {
                telegramUpdateTail = telegramUpdateTail
                  .then(async () => {
                    app.log.info({ updateId }, 'telegram_update_processing_started');
                    await bot.handleUpdate(update as Parameters<typeof bot.handleUpdate>[0]);
                    app.log.info({ updateId }, 'telegram_update_processing_completed');
                  })
                  .catch((error) => {
                    app.log.error({ err: error, updateId }, 'telegram_update_processing_failed');
                  });
              });
              return reply;
            });
          }

          """
          text = text[:webhook_begin] + webhook_replacement + text[webhook_finish:]

          path.write_text(text, encoding='utf-8')

      - name: Install backend dependencies
        working-directory: registration
        run: npm ci

      - name: Typecheck and run incident plus special-event regression tests
        working-directory: registration
        run: |
          set -euo pipefail
          npm run check
          npx tsx --test src/services/telegram-update-guard.test.ts
          npm run test:special-amber-eligibility
          npm run test:special-test-cleanup
          npm run test:special-test-draw-exclusion
          npm run test:special-public-quota
          npm run test:special-draws
          npm run test:special-social-reminders

      - name: Build the exact production container
        run: docker build -f registration/Dockerfile -t kdg80-telegram-export-hotfix .

      - name: Probe production before deployment
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          for url in \
            "https://${FLY_APP}.fly.dev/api/v1/health" \
            "https://${FLY_APP}.fly.dev/api/v1/special/events/amber-combine-jewelry-excursion?token=amber-combine-jewelry-20260811" \
            "https://kgd80.ru/special/amber-combine-jewelry-excursion/"
          do
            echo "=== ${url} ==="
            curl -sS --max-time 20 -o /tmp/probe-body -w 'status=%{http_code} time_total=%{time_total} size=%{size_download}\n' "${url}" || true
            head -c 500 /tmp/probe-body 2>/dev/null || true
            echo
          done

      - name: Commit the tested source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name onedayonemasterpiece
          git config user.email estershow6@gmail.com
          git add registration/src/services/telegram-bot.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix: acknowledge and deduplicate Telegram webhook updates'
            git push origin "HEAD:${HOTFIX_BRANCH}"
          fi

      - name: Set up flyctl 0.4.79
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.79

      - name: Capture live incident evidence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}"
          flyctl status --app "${FLY_APP}"
          flyctl machine list --app "${FLY_APP}"
          flyctl scale show --app "${FLY_APP}"

          raw="$(mktemp)"
          filtered="$(mktemp)"
          trap 'rm -f "${raw}" "${filtered}"' EXIT
          timeout 30s flyctl logs --app "${FLY_APP}" --no-tail >"${raw}" 2>&1 || true
          grep -Ei 'telegram|webhook|timeout|timed out|oom|out of memory|killed|signal|restart|fatal|unhandled|heap|memory|exit code|machine.*(start|stop)' "${raw}" \
            | tail -n 500 \
            | sed -E \
                -e 's/[0-9]{8,}:[A-Za-z0-9_-]{20,}/[BOT_TOKEN]/g' \
                -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[EMAIL]/g' \
                -e 's/(secret|token|key)=([^ &]+)/\1=[REDACTED]/gi' \
            >"${filtered}" || true
          echo "INCIDENT_LOG_LINES=$(wc -l < "${filtered}" | tr -d ' ')"
          cat "${filtered}"

          flyctl ssh console --app "${FLY_APP}" --pty=false --command \
            "sh -lc 'echo === memory ===; grep -E \"^(MemTotal|MemFree|MemAvailable|SwapTotal|SwapFree):\" /proc/meminfo; echo === process ===; ps -eo pid,ppid,rss,vsz,etimes,comm,args | grep -E \"node|npm|tsx|tini\" | grep -v grep || true; echo === db ===; ls -lh /data/registration.sqlite* 2>/dev/null || true'"

          remote_command="node -e 'const token=process.env.TELEGRAM_BOT_TOKEN;if(!token){console.log(JSON.stringify({telegram_bot_token_present:false}));process.exit(0)};fetch(\`https://api.telegram.org/bot\${token}/getWebhookInfo\`).then(r=>r.json()).then(x=>{const y=x&&x.result?x.result:{};let host=null;try{host=y.url?new URL(y.url).host:null}catch{};console.log(JSON.stringify({telegram_bot_token_present:true,ok:x.ok===true,url_host:host,pending_update_count:y.pending_update_count??null,last_error_date:y.last_error_date??null,last_error_message:y.last_error_message??null,max_connections:y.max_connections??null,allowed_updates:y.allowed_updates??null},null,2))}).catch(e=>{console.log(JSON.stringify({probe_error:String(e&&e.message||e)}));process.exitCode=1})'"
          flyctl ssh console --app "${FLY_APP}" --pty=false --command "${remote_command}"

      - name: Deploy the tested hotfix
        shell: bash
        run: flyctl deploy --remote-only --app "${FLY_APP}" --config fly.toml

      - name: Verify health and the 11 August special registration after deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..45}; do
            if curl -fsS --max-time 10 "https://${FLY_APP}.fly.dev/api/v1/health" >/tmp/health.json \
              && grep -q '"ok":true' /tmp/health.json; then
              break
            fi
            sleep 4
          done
          grep -q '"ok":true' /tmp/health.json

          curl -fsS --max-time 15 \
            "https://${FLY_APP}.fly.dev/api/v1/special/events/amber-combine-jewelry-excursion?token=amber-combine-jewelry-20260811" \
            >/tmp/amber-event.json
          grep -q '"slug":"amber-combine-jewelry-excursion"' /tmp/amber-event.json
          grep -q '"requiresRussianCitizenship":false' /tmp/amber-event.json

          curl -fsS --max-time 15 \
            "https://kgd80.ru/special/amber-combine-jewelry-excursion/?hotfix=${GITHUB_RUN_ID}" \
            >/tmp/amber-page.html
          grep -q 'amber-combine-jewelry-excursion' /tmp/amber-page.html

          flyctl releases --app "${FLY_APP}" --json | head -c 4000
