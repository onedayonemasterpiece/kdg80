name: Probe Telegram E2E credential presence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-probe-telegram-e2e-secrets-20260807.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_AUTH_BUNDLE_E2E: ${{ secrets.TELEGRAM_AUTH_BUNDLE_E2E }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Print presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in TG_API_ID TG_API_HASH TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_AUTH_BUNDLE_E2E TELEGRAM_SESSION TG_SESSION TELEGRAM_BOT_TOKEN; do
            [[ -n "${!name:-}" ]] && echo "PRESENT=${name}" || echo "ABSENT=${name}"
          done
