name: Release amber winner email preview

on:
  push:
    branches:
      - feat/amber-combine-jewelry-excursion
    paths:
      - .github/workflows/release-amber-winner-preview.yml

permissions:
  contents: read

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_APP: znanie-kgd80-fest

jobs:
  release-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/amber-combine-jewelry-excursion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: registration/package-lock.json

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify final backend changes before release
        working-directory: registration
        run: |
          npm ci
          npm run check
          npm run test:special-amber-eligibility
          npm run test:special-test-cleanup
          npm run test:special-test-draw-exclusion
          npm run test:special-public-quota
          npm run test:special-draws

      - name: Deploy registration backend
        run: flyctl deploy --remote-only --app "$FLY_APP" --config fly.toml

      - name: Verify production backend and email image
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl -fsS "https://${FLY_APP}.fly.dev/api/v1/health" >/tmp/health.json; then
              break
            fi
            sleep 4
          done
          grep -q '"ok":true' /tmp/health.json
          curl -fsSI "https://${FLY_APP}.fly.dev/shared-assets/email/amber-combine-jewelry-production.png" | grep -q '200'

      - name: Send the real production-rendered approval email through Yandex Postbox
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console -a "$FLY_APP" -C "sh -lc 'cd /app/registration && AMBER_WINNER_PREVIEW_EMAIL=info@kgd80.ru npm run send:amber-winner-preview'" | tee /tmp/preview-send.log
          grep -q '"sent":true' /tmp/preview-send.log
          grep -q 'info@kgd80.ru' /tmp/preview-send.log

      - name: Capture deployed release
        shell: bash
        run: |
          flyctl releases -a "$FLY_APP" --json | head -c 4000
