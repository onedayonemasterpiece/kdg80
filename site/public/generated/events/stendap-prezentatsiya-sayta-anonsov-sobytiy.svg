<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Афиша-загадка для презентации сайта анонсов событий</title>
  <desc id="desc">Тёмная композиция с красным светом, вопросительным знаком, фрагментами интерфейса и скрытыми карточками событий.</desc>
  <defs>
    <radialGradient id="spot" cx="50%" cy="43%" r="60%">
      <stop offset="0" stop-color="#ff3b2e" stop-opacity="0.88"/>
      <stop offset="0.38" stop-color="#7d1118" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#070607"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff2df"/>
      <stop offset="1" stop-color="#f4c7a0"/>
    </linearGradient>
    <linearGradient id="redline" x1="0" x2="1">
      <stop offset="0" stop-color="#ffede3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffede3" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffede3" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <pattern id="microgrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#fff1e8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1050" fill="#080707"/>
  <rect width="1600" height="1050" fill="url(#spot)"/>
  <rect width="1600" height="1050" fill="url(#microgrid)"/>
  <g opacity="0.35" filter="url(#soft)">
    <ellipse cx="850" cy="495" rx="410" ry="360" fill="#ff2d23"/>
    <ellipse cx="435" cy="710" rx="240" ry="160" fill="#111"/>
  </g>

  <g transform="translate(178 130) rotate(-8)" opacity="0.84" filter="url(#shadow)">
    <rect x="0" y="0" width="430" height="560" rx="46" fill="#141111" stroke="#ffede3" stroke-opacity="0.11"/>
    <rect x="40" y="55" width="235" height="18" rx="9" fill="#fff0e8" opacity="0.18"/>
    <rect x="40" y="104" width="335" height="92" rx="22" fill="#fff0e8" opacity="0.08"/>
    <rect x="40" y="226" width="155" height="132" rx="26" fill="#ffede3" opacity="0.12"/>
    <rect x="220" y="226" width="155" height="132" rx="26" fill="#ffede3" opacity="0.07"/>
    <path d="M64 420h270" stroke="#ffede3" stroke-width="12" stroke-linecap="round" opacity="0.15"/>
    <path d="M64 465h205" stroke="#ffede3" stroke-width="12" stroke-linecap="round" opacity="0.11"/>
  </g>

  <g transform="translate(1000 160) rotate(9)" opacity="0.78" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="490" rx="42" fill="#f6d7bd"/>
    <rect x="36" y="44" width="286" height="115" rx="28" fill="#130d0f" opacity="0.95"/>
    <path d="M75 105h205" stroke="#ff4a3d" stroke-width="15" stroke-linecap="round"/>
    <path d="M75 132h122" stroke="#fff5eb" stroke-width="10" stroke-linecap="round" opacity="0.76"/>
    <g fill="#130d0f" opacity="0.82">
      <rect x="38" y="210" width="130" height="110" rx="26"/>
      <rect x="192" y="210" width="130" height="110" rx="26"/>
      <rect x="38" y="348" width="284" height="66" rx="24"/>
    </g>
  </g>

  <g transform="translate(520 150)" filter="url(#shadow)">
    <path d="M286 584c-54 0-96-38-96-91 0-55 43-92 99-92 58 0 101 37 101 92 0 53-43 91-104 91Zm-16-241c-7-83 97-93 97-164 0-35-31-58-81-58-53 0-98 24-136 65L65 105C119 41 195 7 301 7c121 0 213 58 213 160 0 131-145 139-134 176H270Z" fill="#fff1e8"/>
    <path d="M286 584c-54 0-96-38-96-91 0-55 43-92 99-92 58 0 101 37 101 92 0 53-43 91-104 91Zm-16-241c-7-83 97-93 97-164 0-35-31-58-81-58-53 0-98 24-136 65L65 105C119 41 195 7 301 7c121 0 213 58 213 160 0 131-145 139-134 176H270Z" fill="none" stroke="#0d090a" stroke-width="20" opacity="0.36"/>
  </g>

  <g opacity="0.7">
    <path d="M176 838h1248" stroke="url(#redline)" stroke-width="2"/>
    <path d="M280 908h1040" stroke="url(#redline)" stroke-width="2"/>
    <circle cx="326" cy="842" r="8" fill="#fff1e8" opacity="0.55"/>
    <circle cx="1284" cy="910" r="8" fill="#fff1e8" opacity="0.55"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="810" font-size="44" letter-spacing="0.18em" fill="#fff1e8" opacity="0.84">ЧТО СКРЫТО</text>
    <text x="800" y="872" font-size="72" font-weight="800" fill="#fff1e8">за удобным сервисом?</text>
    <text x="800" y="934" font-size="28" letter-spacing="0.12em" fill="#f6d7bd" opacity="0.76">первый показ · обратная связь · персональный подбор</text>
  </g>

  <g transform="translate(1220 760) rotate(-12)" opacity="0.82">
    <rect x="0" y="0" width="210" height="82" rx="24" fill="#0f0b0d" stroke="#fff1e8" stroke-opacity="0.18"/>
    <text x="105" y="53" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#fff1e8">LINK ONLY</text>
  </g>
</svg>
